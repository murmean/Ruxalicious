<h2>Programare Salon Unghii 💅</h2>

<input id="name" placeholder="Nume">
<input id="phone" placeholder="Telefon">
<input type="date" id="date">

<select id="time">
  <option>09:00</option>
  <option>10:00</option>
  <option>11:00</option>
  <option>12:00</option>
  <option>13:00</option>
  <option>14:00</option>
</select>

<button onclick="book()">Programează</button>

<script>
async function book(){
    const res = await fetch("https://ruxalicious.onrender.com/book", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            name: document.getElementById("name").value,
            phone: document.getElementById("phone").value,
            date: document.getElementById("date").value,
            time: document.getElementById("time").value
        })
    });

    const data = await res.json();
    alert(data.message);
}
</script>
